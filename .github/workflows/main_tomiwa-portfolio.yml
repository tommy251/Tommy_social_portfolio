# Minor change to trigger redeploy on 2025-07-25
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js and Python app to Azure Web App - tomiwa-portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Use Yarn
        run: npm install -g yarn@1.22.22

      - name: Yarn install
        working-directory: ./frontend
        run: yarn install

      - name: Build with CRACO
        working-directory: ./frontend
        run: npx craco build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Match Azure's Python runtime

      - name: Install Python and pip
        run: |
          python3 -m ensurepip --upgrade
          python3 -m pip install --upgrade pip

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Create deployment package
        run: |
          mkdir deploy-package
          cp -r ./frontend/build/. deploy-package/
          cp -r ./backend/. deploy-package/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: deploy-package

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tomiwa-portfolio'
          slot-name: 'Production'
          package: deploy-package
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_42B87D1EFC2D46B38A16A0C04D9EFE8E }}
