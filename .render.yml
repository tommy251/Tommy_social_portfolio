services:
  - type: web
    name: tomsocialportfolio
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker server:app
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false